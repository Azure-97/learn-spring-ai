spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/spring_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root

  ai:
    dashscope:
      api-key: ${DASHSCOP_API_KEY}
      chat:
        options:
          model: qwen-plus  # 可选，默认 qwen-turbo
    chat:
      memory:
        repository:
          re



    memory:
      redis:
        host: localhost
        port: 6379
        password:               # 有密码则填写，无密码留空
        timeout: 5000           # 连接超时（毫秒）


